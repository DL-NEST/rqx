[package]
name = "rqx"
version = "0.1.1"
rust-version = "1.85.0"
description = "MQTT Broker"
keywords = ["mqtt-broker"]
license = "MIT OR Apache-2.0"
readme = "README.md"
authors = ["dlnest <dlnestmit@gamil.com>"]
homepage = "https://github.com/DL-NEST/rqx/blob/main/README.md"
repository = "https://github.com/DL-NEST/rqx.git"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rqx_macros = { version = "0.1.0", path = "../rqx_macros", optional = true }
tokio = { version = "^1.44", features = ["full"] }

[features]
default = ["macros"]

macros = ["rqx_macros"]